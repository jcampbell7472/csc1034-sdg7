<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Database Test Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-family: monospace;
            font-size: 14px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        pre {
            background: #f4f4f4;
            padding: 15px;
            margin-top: 20px;
            overflow-x: auto;
        }
    </style>
</head>
<body>

<h2>SQL Test Interface</h2>

<textarea id="query">
SELECT * FROM EnergySource;
</textarea>

<br>
<button onclick="runQuery()">Run Query</button>

<h3>Result:</h3>
<pre id="output">Waiting for query...</pre>

<script>
function runQuery() {
    const query = document.getElementById("query").value;

    fetch("dbConnector.php", {  // 🔴 CHANGE THIS
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: "query=" + encodeURIComponent(query)
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    })
    .catch(error => {
        document.getElementById("output").textContent = "Error: " + error;
    });
}
</script>

</body>
</html>
