<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Annual Emissions Management</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>Annual Emissions Records</h1>

    <!-- output message -->
    <p id="output"></p>

    <!-- form -->
    <h2 id="formTitle">Add Record</h2>

    <div class="form-container">
        <label for="year">Year:</label>
        <input type="number" id="year" placeholder="e.g. 2024">

        <label for="emissions">Emissions (MtCO2e):</label>
        <input type="number" step="0.001" id="emissions" placeholder="e.g. 371.000">

        <br><br>

        <button id="submitBtn" onclick="submitForm()">Add Record</button>
        <button onclick="resetForm()">Clear</button>
    </div>

    <hr>

    <!-- table -->
    <h2>Existing Records</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Year</th>
                <th>Emissions (MtCO2e)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="emissionsBody">
            <!-- filled by JS -->
        </tbody>
    </table>

    <!-- link JS -->
    <script src="../reports/reports_js/matthew.js"></script>

</body>
</html>
